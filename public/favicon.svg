<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot Head -->
  <rect x="20" y="15" width="60" height="50" rx="8" fill="#00D4FF" stroke="#0099CC" stroke-width="2"/>
  
  <!-- Left Eye -->
  <circle cx="35" cy="35" r="6" fill="#333"/>
  <circle cx="37" cy="33" r="2" fill="#fff"/>
  
  <!-- Right Eye -->
  <circle cx="65" cy="35" r="6" fill="#333"/>
  <circle cx="67" cy="33" r="2" fill="#fff"/>
  
  <!-- Mouth -->
  <line x1="35" y1="55" x2="65" y2="55" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="30" y="65" width="40" height="20" rx="4" fill="#00D4FF" stroke="#0099CC" stroke-width="2"/>
  
  <!-- Left Arm -->
  <rect x="10" y="70" width="20" height="8" rx="4" fill="#00D4FF" stroke="#0099CC" stroke-width="2"/>
  <circle cx="12" cy="74" r="3" fill="#0099CC"/>
  
  <!-- Right Arm -->
  <rect x="70" y="70" width="20" height="8" rx="4" fill="#00D4FF" stroke="#0099CC" stroke-width="2"/>
  <circle cx="88" cy="74" r="3" fill="#0099CC"/>
</svg>
